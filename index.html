<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GregAI</title><meta name="theme-color" content="#f7f8fc"><link rel="icon" href="Icon/favicon.ico"><link rel="apple-touch-icon" href="Icon/apple-touch-icon.png">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--soft:#eef1f7;--text:#171a22;--muted:#6e7482;--line:#e7e9ef;--brand:#6757e8;--brand2:#4b89ff;--danger:#c92d4b;--shadow:0 18px 50px #2427351a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#eceaff,transparent 30%),var(--bg);color:var(--text);height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}.hidden{display:none!important}button{cursor:pointer}.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:inherit}.icon-btn:hover{background:var(--soft)}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.primary{border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));padding:12px 16px;font-weight:750;box-shadow:0 8px 20px #6757e838}.primary:disabled{opacity:.55;cursor:wait}.ghost{border:0;border-radius:12px;background:var(--soft);padding:10px 14px}.auth{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:var(--bg);z-index:20}.auth-card{width:min(440px,100%);background:var(--panel);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.logo{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:850}.logo img{width:42px;height:42px;object-fit:contain}.note{font-size:13px;color:var(--muted);line-height:1.5}.tabs{display:flex;background:var(--soft);padding:4px;border-radius:14px;margin:24px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:750}.tabs button.active{background:#fff;box-shadow:0 3px 12px #dfe2ea}.stack{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}input:focus,textarea:focus,select:focus{border-color:#9a90ed;box-shadow:0 0 0 3px #e8e5ff}.message{min-height:20px;font-size:13px}.message.error{color:var(--danger)}.message.ok{color:#117651}.app{display:grid;grid-template-columns:270px 1fr;height:100dvh}.sidebar{background:#ffffffdd;backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;z-index:10}.side-head{display:flex;align-items:center;justify-content:space-between}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:13px;display:flex;align-items:center;gap:12px;color:#4d5260}.nav button.active{background:#eceaff;color:#4e3ed1;font-weight:760}.profile{display:flex;align-items:center;gap:10px;padding:10px;margin-top:auto}.avatar{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#e4e0ff}.profile-text{min-width:0;flex:1}.profile-text b,.profile-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-text span{font-size:12px;color:var(--muted)}.main{min-width:0;display:grid;grid-template-rows:70px 1fr}.topbar{display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);background:#f7f8fccc}.top-title{flex:1}.top-title b,.top-title span{display:block}.top-title span{font-size:12px;color:var(--muted)}.mobile-menu{display:none}.content{overflow:auto;padding:24px}.home,.workspace,.admin{max-width:1050px;margin:auto}.hero{background:linear-gradient(135deg,#fff 30%,#eeeaff);border:1px solid #ebe9ff;border-radius:26px;padding:28px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(30px,5vw,48px);margin:8px 0;letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.tool{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;text-align:left}.tool:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.bubble{width:42px;height:42px;border-radius:14px;background:#efedff;color:#5c4bd4;display:grid;place-items:center}.tool h3{margin:14px 0 5px}.tool p{margin:0;color:var(--muted);font-size:13px}.workspace{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px}.modebar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:18px}.modebar div:nth-child(2){flex:1}.modebar b,.modebar span{display:block}.modebar span{font-size:12px;color:var(--muted)}.modebar select{width:auto}.messages{overflow:auto;padding:10px 4px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto;text-align:center;color:var(--muted)}.msg{max-width:88%;line-height:1.6;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#6657df;color:#fff;padding:12px 15px;border-radius:18px 18px 4px 18px}.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);padding:14px 17px;border-radius:4px 18px 18px 18px}.composer{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 12px 35px #282c3c14}.composer textarea{border:0;box-shadow:none;resize:none;min-height:64px}.compose-row{display:flex;gap:8px;align-items:center}.compose-row select{width:auto;background:var(--soft);border:0}.send{margin-left:auto;background:var(--text);color:#fff}.backdrop{display:none}.users{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden}.users th,.users td{padding:14px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff1d9;color:#8c5a00;font-size:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.backdrop.open{display:block;position:fixed;inset:0;background:#14162455;z-index:9}.mobile-menu{display:grid}.content{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.auth-card{padding:22px}.content{padding:10px}.main{grid-template-rows:62px 1fr}.modebar{flex-wrap:wrap}.modebar select{max-width:145px}.msg{max-width:94%}}
</style></head><body>
<section id="authView" class="auth"><div class="auth-card"><div class="logo"><img src="Icon/logo.svg" onerror="this.hidden=true" alt="GregAI"><span>GregAI</span></div><p class="note">Chat, Lernen, Coding, Schreiben und Planung an einem Ort.</p><div class="tabs"><button type="button" id="loginTab" class="active">Anmelden</button><button type="button" id="registerTab">Registrieren</button></div><form id="authForm" class="stack" novalidate><div id="nameField" class="field hidden"><label for="displayName">Name</label><input id="displayName" maxlength="80" autocomplete="name"></div><div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Passwort</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button type="submit" id="authSubmit" class="primary">Anmelden</button><div id="authMessage" class="message" role="status" aria-live="polite"></div><p class="note">Nach der Registrierung muss ein Administrator dein Konto freigeben.</p></form></div></section>
<section id="pendingView" class="auth hidden"><div class="auth-card"><div class="logo"><img src="Icon/logo.svg" onerror="this.hidden=true" alt=""><span>Freigabe ausstehend</span></div><p class="note">Dein Konto wurde angelegt. Du kannst GregAI verwenden, sobald ein Administrator es freigegeben hat.</p><div class="stack"><button type="button" id="checkApproval" class="primary">Status prüfen</button><button type="button" id="pendingLogout" class="ghost">Abmelden</button></div></div></section>
<div id="appView" class="app hidden"><div id="backdrop" class="backdrop"></div><aside id="sidebar" class="sidebar"><div class="side-head"><div class="logo"><img src="Icon/logo.svg" onerror="this.hidden=true" alt=""><span>GregAI</span></div><button type="button" id="closeSide" class="icon-btn"><svg><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><nav id="nav" class="nav"></nav><div class="profile"><div id="avatar" class="avatar">G</div><div class="profile-text"><b id="profileName">Nutzer</b><span id="profileEmail"></span></div><button type="button" id="logout" class="icon-btn" title="Abmelden"><svg><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg></button></div></aside><main class="main"><header class="topbar"><button type="button" id="menu" class="icon-btn mobile-menu"><svg><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="top-title"><b id="pageTitle">Start</b><span id="pageSub"></span></div><button type="button" id="newChat" class="icon-btn"><svg><path d="M12 5v14M5 12h14"/></svg></button></header><section id="content" class="content"></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const CONFIG={SUPABASE_URL:'https://nyogpvataecfqnzqikqf.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_DR6Vf8DpDKdQjUZEBI51Zw_f2ASxVMN',FUNCTION_NAME:'gregai-chat'};
const ui={auth:document.getElementById('authView'),pending:document.getElementById('pendingView'),app:document.getElementById('appView'),loginTab:document.getElementById('loginTab'),registerTab:document.getElementById('registerTab'),form:document.getElementById('authForm'),nameField:document.getElementById('nameField'),name:document.getElementById('displayName'),email:document.getElementById('email'),password:document.getElementById('password'),submit:document.getElementById('authSubmit'),message:document.getElementById('authMessage')};
let client=null,authMode='login',session=null,profile=null,current='home',messages=[],busy=false;
const icons={home:'<svg><path d="m3 11 9-8 9 8v9H4zM9 21v-7h6v7"/></svg>',chat:'<svg><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1-5a7 7 0 0 1-1-4V8a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>',code:'<svg><path d="m8 9-4 3 4 3m8-6 4 3-4 3m-2-9-4 12"/></svg>',learn:'<svg><path d="m2 9 10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></svg>',write:'<svg><path d="M4 20h16M6 16l10-10 2 2L8 18H6z"/></svg>',summary:'<svg><path d="M5 4h14M5 8h14M5 12h9M5 16h11M5 20h7"/></svg>',plan:'<svg><path d="M8 3v3m8-3v3M4 9h16M4 5h16v15H4z"/></svg>',translate:'<svg><path d="M4 5h8M8 3v2m-3 4c2 3 5 5 8 6m-1-8c-1 4-4 7-8 9m10 4 3-8 3 8m-5-3h4"/></svg>',admin:'<svg><path d="M12 2 4 5v6c0 5 3 9 8 11 5-2 8-6 8-11V5zM9 12l2 2 4-5"/></svg>'};
const modes={home:['Start','Deine Werkzeuge auf einen Blick'],chat:['Chat','Offene Fragen und Ideen'],code:['Coding Studio','Code schreiben, prüfen und erklären'],learn:['Lern-Agent','Verstehen, üben und prüfen'],write:['Schreibwerkstatt','Texte entwerfen und verbessern'],summary:['Zusammenfassen','Inhalte klar verdichten'],plan:['Planer','Ziele in nächste Schritte verwandeln'],translate:['Übersetzer','Natürlich statt wortwörtlich']};
function setMessage(text,type='error'){ui.message.textContent=text;ui.message.className='message '+type}
function setAuthMode(mode){authMode=mode;const reg=mode==='register';ui.loginTab.classList.toggle('active',!reg);ui.registerTab.classList.toggle('active',reg);ui.nameField.classList.toggle('hidden',!reg);ui.name.required=reg;ui.submit.textContent=reg?'Konto erstellen':'Anmelden';ui.password.autocomplete=reg?'new-password':'current-password';setMessage('','')}
ui.loginTab.addEventListener('click',()=>setAuthMode('login'));
ui.registerTab.addEventListener('click',()=>setAuthMode('register'));
function readyClient(){if(client)return true;if(!window.supabase){setMessage('Die Supabase-Bibliothek konnte nicht geladen werden. Prüfe Internetverbindung oder Content-Security-Policy.');return false}if(CONFIG.SUPABASE_URL.includes('DEIN-')||CONFIG.SUPABASE_PUBLISHABLE_KEY.includes('DEIN_')){setMessage('Bitte zuerst SUPABASE_URL und SUPABASE_PUBLISHABLE_KEY in der HTML-Datei eintragen.');return false}client=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
ui.form.addEventListener('submit',async e=>{e.preventDefault();setMessage('','');if(!readyClient())return;const email=ui.email.value.trim(),password=ui.password.value;if(!email){setMessage('Bitte eine gültige E-Mail-Adresse eingeben.');return}if(password.length<8){setMessage('Das Passwort muss mindestens 8 Zeichen haben.');return}if(authMode==='register'&&!ui.name.value.trim()){setMessage('Bitte deinen Namen eingeben.');return}ui.submit.disabled=true;ui.submit.textContent=authMode==='register'?'Konto wird erstellt …':'Anmeldung läuft …';try{if(authMode==='register'){const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:ui.name.value.trim()}}});if(error)throw error;if(data.session){setMessage('Konto erstellt. Freigabe wird geprüft …','ok')}else{setMessage('Konto erstellt. Bitte bestätige die E-Mail und melde dich danach an.','ok');ui.form.reset();setTimeout(()=>setAuthMode('login'),1800)}}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error}}catch(err){setMessage(translateAuthError(err?.message||String(err)))}finally{ui.submit.disabled=false;ui.submit.textContent=authMode==='register'?'Konto erstellen':'Anmelden'}});
function translateAuthError(s){if(s.includes('User already registered'))return'Diese E-Mail-Adresse ist bereits registriert.';if(s.includes('Password should be'))return'Das Passwort erfüllt die Supabase-Anforderungen nicht.';if(s.includes('Invalid login credentials'))return'E-Mail-Adresse oder Passwort ist falsch.';if(s.includes('Email rate limit exceeded'))return'Zu viele E-Mails angefordert. Bitte später erneut versuchen.';return s}
function show(which){ui.auth.classList.toggle('hidden',which!=='auth');ui.pending.classList.toggle('hidden',which!=='pending');ui.app.classList.toggle('hidden',which!=='app')}
async function route(s){session=s;if(!s){show('auth');return}const {data,error}=await client.from('profiles').select('*').eq('id',s.user.id).single();if(error){show('auth');setMessage('Profil konnte nicht geladen werden: '+error.message);return}profile=data;if(!profile.approved){show('pending');return}show('app');document.getElementById('profileName').textContent=profile.display_name||'Nutzer';document.getElementById('profileEmail').textContent=s.user.email||'';document.getElementById('avatar').textContent=(profile.display_name||s.user.email||'G')[0].toUpperCase();buildNav();openMode('home')}
async function boot(){if(!readyClient())return;client.auth.onAuthStateChange((_event,s)=>setTimeout(()=>route(s),0));const {data}=await client.auth.getSession();route(data.session)}
document.getElementById('logout').onclick=document.getElementById('pendingLogout').onclick=()=>client?.auth.signOut();document.getElementById('checkApproval').onclick=()=>route(session);
function buildNav(){const list=['home','chat','code','learn','write','summary','plan','translate'];if(profile?.is_admin)list.push('admin');document.getElementById('nav').innerHTML=list.map(k=>`<button type="button" data-mode="${k}">${icons[k]}<span>${k==='admin'?'Admin-Freigaben':modes[k][0]}</span></button>`).join('');document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-mode]');if(b)openMode(b.dataset.mode)}}
function openMode(k){current=k;messages=[];closeSide();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===k));if(k==='admin'){renderAdmin();return}document.getElementById('pageTitle').textContent=modes[k][0];document.getElementById('pageSub').textContent=modes[k][1];document.getElementById('newChat').style.visibility=k==='home'?'hidden':'visible';k==='home'?renderHome():renderWorkspace()}
function renderHome(){document.getElementById('content').innerHTML=`<div class="home"><div class="hero"><span class="pill">DEINE KI-WERKZEUGKISTE</span><h1>Was möchtest du heute schaffen?</h1><p>Wähle ein spezialisiertes Werkzeug, statt jedes Mal einen langen Prompt zu schreiben.</p><div class="grid">${Object.keys(modes).filter(k=>k!=='home').map(k=>`<button type="button" class="tool" data-mode="${k}"><span class="bubble">${icons[k]}</span><h3>${modes[k][0]}</h3><p>${modes[k][1]}</p></button>`).join('')}</div></div></div>`;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>openMode(b.dataset.mode))}
function renderWorkspace(){document.getElementById('content').innerHTML=`<div class="workspace"><div class="modebar"><div class="bubble">${icons[current]}</div><div><b>${modes[current][0]}</b><span>${modes[current][1]}</span></div><select id="depth"><option value="direct">Direkte Antwort</option><option value="balanced" selected>Ausgewogen</option><option value="deep">Tiefere Analyse</option></select></div><div id="messages" class="messages"><div class="welcome"><h2>${modes[current][0]}</h2><p>Beschreibe dein Ziel. GregAI passt die Antwort an dieses Werkzeug an.</p></div></div><form id="composer" class="composer"><textarea id="prompt" placeholder="Nachricht eingeben …" required></textarea><div class="compose-row"><select id="tone"><option value="normal">Normal</option><option value="concise">Kurz</option><option value="detailed">Ausführlich</option></select><button class="icon-btn send" type="submit">${icons.chat}</button></div></form></div>`;document.getElementById('composer').onsubmit=send}
function draw(){const box=document.getElementById('messages');box.innerHTML=messages.map(m=>`<article class="msg ${m.role==='user'?'user':'ai'}"></article>`).join('')+(busy?'<article class="msg ai">GregAI denkt …</article>':'');[...box.querySelectorAll('.msg:not(:last-child),.msg:last-child')].forEach((el,i)=>{if(i<messages.length)el.textContent=messages[i].content});box.scrollTop=box.scrollHeight}
async function send(e){e.preventDefault();if(busy)return;const input=document.getElementById('prompt'),text=input.value.trim();if(!text)return;messages.push({role:'user',content:text});input.value='';busy=true;draw();try{const {data,error}=await client.functions.invoke(CONFIG.FUNCTION_NAME,{body:{mode:current,depth:document.getElementById('depth').value,tone:document.getElementById('tone').value,messages:messages.slice(-20)}});if(error)throw error;messages.push({role:'assistant',content:data?.content||data?.error||'Leere Antwort'})}catch(err){messages.push({role:'assistant',content:'Fehler: '+(err?.message||String(err))})}finally{busy=false;draw()}}
async function renderAdmin(){document.getElementById('pageTitle').textContent='Admin-Freigaben';document.getElementById('pageSub').textContent='Nutzer prüfen und freigeben';document.getElementById('newChat').style.visibility='hidden';document.getElementById('content').innerHTML='<div class="admin"><h2>Nutzerverwaltung</h2><div id="users">Lädt …</div></div>';const {data,error}=await client.from('profiles').select('id,display_name,email,approved').order('created_at',{ascending:false});if(error){document.getElementById('users').textContent=error.message;return}document.getElementById('users').innerHTML=`<table class="users"><tr><th>Nutzer</th><th>Status</th><th>Aktion</th></tr>${data.map(u=>`<tr><td>${escapeHtml(u.display_name||'Ohne Name')}<br><span class="note">${escapeHtml(u.email||'')}</span></td><td>${u.approved?'Freigegeben':'Wartet'}</td><td><button type="button" class="ghost approve" data-id="${u.id}" data-value="${!u.approved}">${u.approved?'Sperren':'Freigeben'}</button></td></tr>`).join('')}</table>`;document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await client.from('profiles').update({approved:b.dataset.value==='true'}).eq('id',b.dataset.id);if(error)alert(error.message);else renderAdmin()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function closeSide(){document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}document.getElementById('menu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('backdrop').classList.add('open')};document.getElementById('closeSide').onclick=document.getElementById('backdrop').onclick=closeSide;document.getElementById('newChat').onclick=()=>{if(current!=='home'&&current!=='admin')renderWorkspace()};setAuthMode('login');boot();
</script></body></html>
